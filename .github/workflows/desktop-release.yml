name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore desktop-app/FlowShield.Desktop.csproj

    - name: Build
      run: dotnet build desktop-app/FlowShield.Desktop.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test desktop-app/FlowShield.Desktop.Tests/FlowShield.Desktop.Tests.csproj --configuration Release --no-restore --verbosity normal

    - name: Publish
      run: dotnet publish desktop-app/FlowShield.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Compile Installer (Inno Setup)
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: desktop-app/FlowShield-Setup.iss

    - name: Zip Release
      run: Compress-Archive -Path ./publish/* -DestinationPath ./FlowShield-Windows-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          FlowShield-Windows-x64.zip
          desktop-app/installer/FlowShield-Setup-v*.exe
        body_path: RELEASE_NOTES.md
        generate_release_notes: false

  msix-release:
    name: Build & Sign MSIX (Microsoft Store)
    runs-on: windows-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/ext-')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore signing cert
        id: cert
        env:
          PFX_BASE64: ${{ secrets.STORE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.STORE_PFX_PASSWORD }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP\store.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = Import-PfxCertificate -FilePath $pfxPath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Remove-Item $pfxPath
        shell: pwsh

      - name: Build MSIX
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath
          $wapProjPath = Join-Path $vsPath "MSBuild\Microsoft\DesktopBridge"
          Write-Host "WapProjPath resolved to: $wapProjPath"
          if (-not (Test-Path $wapProjPath)) {
            Write-Error "DesktopBridge MSBuild props not found at $wapProjPath"
            exit 1
          }

          # Detect highest available UAP SDK version (avoids APPX3217)
          $uapBase = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP"
          if (Test-Path $uapBase) {
            $targetPlatformVersion = (Get-ChildItem $uapBase | Sort-Object Name -Descending | Select-Object -First 1).Name
          } else {
            $targetPlatformVersion = "10.0.19041.0"
          }
          Write-Host "TargetPlatformVersion: $targetPlatformVersion"

          msbuild desktop-app/FlowShield.Packaging/FlowShield.Packaging.wapproj `
            /restore `
            /p:RuntimeIdentifier=win-x64 `
            /p:WapProjPath="$wapProjPath\" `
            /p:TargetPlatformVersion=$targetPlatformVersion `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundlePlatforms=x64 `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:PackageCertificateThumbprint=${{ steps.cert.outputs.CERT_THUMBPRINT }} `
            /p:AppxPackageDir=AppxPackages\
        shell: pwsh

      - name: Upload MSIX to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msix = Get-ChildItem "AppxPackages\" -Filter "*.msixupload" -Recurse | Select-Object -First 1
          if (-not $msix) { $msix = Get-ChildItem "AppxPackages\" -Filter "*.msixbundle" -Recurse | Select-Object -First 1 }
          gh release upload ${{ github.ref_name }} $msix.FullName --repo ${{ github.repository }}
        shell: pwsh
