name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore desktop-app/FlowShield.Desktop.csproj

    - name: Build
      run: dotnet build desktop-app/FlowShield.Desktop.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test desktop-app/FlowShield.Desktop.Tests/FlowShield.Desktop.Tests.csproj --configuration Release --no-restore --verbosity normal

    - name: Publish
      run: dotnet publish desktop-app/FlowShield.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Compile Installer (Inno Setup)
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: desktop-app/FlowShield-Setup.iss

    - name: Zip Release
      run: Compress-Archive -Path ./publish/* -DestinationPath ./FlowShield-Windows-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          FlowShield-Windows-x64.zip
          desktop-app/installer/FlowShield-Setup-v*.exe
        body_path: RELEASE_NOTES.md
        generate_release_notes: false

  msix-release:
    name: Build & Sign MSIX (Microsoft Store)
    runs-on: windows-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/ext-')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore signing cert
        id: cert
        env:
          PFX_BASE64: ${{ secrets.STORE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.STORE_PFX_PASSWORD }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP\store.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = Import-PfxCertificate -FilePath $pfxPath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Remove-Item $pfxPath
        shell: pwsh

      - name: Build MSIX
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.CERT_THUMBPRINT }}
        run: |
          # 1. Publish app (framework-dependent DLL layout for MSIX)
          dotnet publish desktop-app/FlowShield.Desktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o ./msix-content
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 2. Copy MSIX manifest and Store assets into the publish folder
          Copy-Item desktop-app/FlowShield.Packaging/Package.appxmanifest ./msix-content/AppxManifest.xml
          New-Item -ItemType Directory -Force -Path ./msix-content/Assets | Out-Null
          Copy-Item desktop-app/FlowShield.Packaging/Assets/* ./msix-content/Assets/ -Force

          # 3. Find MakeAppx.exe and signtool.exe from Windows SDK
          $kitBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeAppx = Get-ChildItem $kitBin -Filter "makeappx.exe" -Recurse |
            Where-Object { $_.DirectoryName -match "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Get-ChildItem $kitBin -Filter "signtool.exe" -Recurse |
            Where-Object { $_.DirectoryName -match "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          Write-Host "MakeAppx: $($makeAppx.FullName)"
          Write-Host "SignTool: $($signtool.FullName)"

          # 4. Pack MSIX
          New-Item -ItemType Directory -Force -Path ./AppxPackages | Out-Null
          & $makeAppx.FullName pack /d ./msix-content /p ./AppxPackages/FlowShield.msix /nv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 5. Sign MSIX
          & $signtool.FullName sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT `
            /tr http://timestamp.digicert.com /td SHA256 `
            ./AppxPackages/FlowShield.msix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "MSIX built: ./AppxPackages/FlowShield.msix"
        shell: pwsh

      - name: Upload MSIX to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msix = Get-ChildItem "AppxPackages\" -Filter "*.msix" -Recurse | Select-Object -First 1
          gh release upload ${{ github.ref_name }} $msix.FullName --repo ${{ github.repository }}
        shell: pwsh
