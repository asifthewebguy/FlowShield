name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required by SignPath action

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore desktop-app/FlowShield.Desktop.csproj

    - name: Build
      run: dotnet build desktop-app/FlowShield.Desktop.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test desktop-app/FlowShield.Desktop.Tests/FlowShield.Desktop.Tests.csproj --configuration Release --no-restore --verbosity normal

    - name: Publish
      run: dotnet publish desktop-app/FlowShield.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    # Upload unsigned exe so SignPath can fetch it for signing
    - name: Upload unsigned executable
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-exe
        path: ./publish/FlowShield.exe

    - name: Sign Executable (SignPath Foundation)
      uses: SignPath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        project-slug: flowshield
        signing-policy-slug: release-signing
        artifact-configuration-slug: exe
        github-artifact-id: unsigned-exe
        wait-for-completion: true
        output-artifact-directory: ./publish

    - name: Compile Installer (Inno Setup)
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: desktop-app/FlowShield-Setup.iss

    # Upload unsigned installer so SignPath can sign it
    - name: Upload unsigned installer
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-installer
        path: desktop-app/installer/FlowShield-Setup-v*.exe

    - name: Sign Installer (SignPath Foundation)
      uses: SignPath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        project-slug: flowshield
        signing-policy-slug: release-signing
        artifact-configuration-slug: installer
        github-artifact-id: unsigned-installer
        wait-for-completion: true
        output-artifact-directory: desktop-app/installer/signed

    - name: Zip Release
      run: Compress-Archive -Path ./publish/* -DestinationPath ./FlowShield-Windows-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          FlowShield-Windows-x64.zip
          desktop-app/installer/signed/FlowShield-Setup-v*.exe
        body_path: RELEASE_NOTES.md
        generate_release_notes: false
