name: Load Test — Activity Sync

# Run manually or on a weekly schedule (Sunday 02:00 UTC).
# Never runs on push/PR to avoid hammering production.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (e.g. https://flowshield.app)'
        required: false
        default: 'https://flowshield.app'
  schedule:
    - cron: '0 2 * * 0'   # Sunday 02:00 UTC

jobs:
  load-test:
    name: k6 — POST /api/activity/sync
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Fetch load-test JWT
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://flowshield.app' }}
          LOAD_TEST_EMAIL:    ${{ secrets.LOAD_TEST_EMAIL }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
        run: |
          if [ -z "$LOAD_TEST_EMAIL" ] || [ -z "$LOAD_TEST_PASSWORD" ]; then
            echo "::error::LOAD_TEST_EMAIL or LOAD_TEST_PASSWORD secret is not set"
            exit 1
          fi
          body=$(jq -n --arg e "$LOAD_TEST_EMAIL" --arg p "$LOAD_TEST_PASSWORD" \
            '{email:$e, password:$p, rememberMe:true}')
          response=$(curl -sS -w "\n%{http_code}" -X POST "$BASE_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(echo "$response" | tail -n1)
          payload=$(echo "$response" | sed '$d')
          if [ "$status" != "200" ]; then
            echo "::error::Login to $BASE_URL failed with status $status"
            echo "$payload"
            exit 1
          fi
          token=$(echo "$payload" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "::error::Login returned 200 but no token field"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run load test
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://flowshield.app' }}
        run: |
          k6 run \
            --env BASE_URL="$BASE_URL" \
            --env TOKEN="$TOKEN" \
            --out json=load-test-results.json \
            web-app/load-tests/sync.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.json
          retention-days: 30
