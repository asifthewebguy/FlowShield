name: Desktop v3 Release

# v3.* tags fire this workflow (the Tauri 2 desktop pipeline).
# v1.* / v2.* tags fire .github/workflows/desktop-release.yml instead
# (the legacy .NET v2 Windows pipeline). Don't broaden either glob
# without disambiguating, or both workflows will fire on the same tag.
on:
  push:
    tags:
      - 'v3.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (manual runs only — must already exist on origin)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-linux:
    name: Build Linux bundles
    # Pinned to 22.04 because Tauri's webkit2gtk-4.1 dep doesn't ship on
    # newer Ubuntu yet; bump when 24.04 catches up.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxss-dev \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
        # Skipping `cache: npm` because the repo doesn't commit
        # package-lock.json (matches the gitignored Cargo.lock convention).
        # setup-node's cache feature requires a lockfile to compute the
        # cache key. Costs ~30s of npm install per run; revisit if we ever
        # commit lockfiles.

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app-v3/src-tauri

      - name: Install JS deps
        working-directory: desktop-app-v3
        # `npm ci` requires package-lock.json. The repo currently doesn't
        # commit it (Cargo.lock convention), so fall back to npm install
        # if ci fails.
        run: npm ci || npm install

      - name: Build Tauri bundles
        working-directory: desktop-app-v3
        run: npm run tauri:build

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          cp desktop-app-v3/src-tauri/target/release/bundle/deb/*.deb release-artifacts/ 2>/dev/null || true
          cp desktop-app-v3/src-tauri/target/release/bundle/rpm/*.rpm release-artifacts/ 2>/dev/null || true
          cp desktop-app-v3/src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/ 2>/dev/null || true
          echo "--- staged artifacts ---"
          ls -la release-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS bundle (universal)
    # macos-latest is arm64 in 2026; rust toolchain installs both targets so
    # `--target universal-apple-darwin` produces one .dmg that runs on Intel
    # AND Apple Silicon. Slower build (~15 min) but one artifact, one link.
    # Bundle is unsigned + unnotarized — first launch needs right-click → Open
    # to bypass Gatekeeper. Code signing is a follow-up once we have an
    # Apple Developer Program account.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app-v3/src-tauri
          # Keyed separately from Linux so the two runners don't trample
          # each other's caches in the shared GHA cache backend.
          key: macos

      - name: Install JS deps
        working-directory: desktop-app-v3
        run: npm ci || npm install

      - name: Build universal macOS bundle
        working-directory: desktop-app-v3
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          # Tauri puts the .dmg under the universal target dir.
          cp desktop-app-v3/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          echo "--- staged artifacts ---"
          ls -la release-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  build-linux-cuda:
    name: Build CUDA Linux AppImage
    # Non-blocking: a failure here (fragile GPU toolchain) must never block the
    # CPU release. The release ships without the cuda asset instead.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxss-dev \
            patchelf \
            file

      - name: Install CUDA toolkit 12.6
        # Installs only what candle's cuda backend needs: nvcc (compile
        # candle-kernels) + cudart. cublas/curand are named libcublas-/libcurand-
        # in NVIDIA's apt repo (not cuda-*), so they go in non-cuda-sub-packages —
        # Jimver maps sub-packages -> cuda-<name>-12-6 and
        # non-cuda-sub-packages -> <name>-12-6. Exports CUDA_PATH as an env var
        # (not a step output), so reference $CUDA_PATH at the shell level.
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.6.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev", "libcurand", "libcurand-dev"]'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app-v3/src-tauri
          # Distinct key so the cuda build's artifacts don't trample the CPU cache.
          key: linux-cuda

      - name: Install JS deps
        working-directory: desktop-app-v3
        run: npm ci || npm install

      - name: Build CUDA AppImage
        working-directory: desktop-app-v3
        env:
          CUDA_COMPUTE_CAP: '75'
        # linuxdeploy bundles the binary's NEEDED libs; point the loader at the
        # toolkit lib dir so libcudart/libcublas/libcurand get pulled into the
        # AppImage. The Jimver action exports CUDA_PATH as an env var (not a step
        # output), so reference $CUDA_PATH at the shell level.
        run: |
          export LD_LIBRARY_PATH="$CUDA_PATH/lib64:${LD_LIBRARY_PATH:-}"
          npm run tauri:build -- --features cuda --bundles appimage

      - name: Stage + rename cuda AppImage
        run: |
          set -euo pipefail
          SRC=$(ls desktop-app-v3/src-tauri/target/release/bundle/appimage/FlowShield_*_amd64.AppImage)
          mkdir -p release-artifacts
          BASE=$(basename "${SRC%_amd64.AppImage}")
          DEST="release-artifacts/${BASE}_amd64-cuda.AppImage"
          mv "$SRC" "$DEST"
          echo "--- staged ---"
          ls -la release-artifacts/

      - name: Assert CUDA runtime libs are bundled
        # The one novel risk: a "cuda" AppImage that silently bundled no CUDA
        # runtime would fall back to CPU on the user's machine. Extract the
        # AppImage (no FUSE needed) and fail THIS job (not the release) if
        # libcudart isn't inside it.
        run: |
          set -euo pipefail
          APPIMAGE=$(ls release-artifacts/FlowShield_*_amd64-cuda.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          # linuxdeploy may place the lib under usr/lib/ OR the multiarch
          # usr/lib/x86_64-linux-gnu/ — search the whole tree so a bundled lib
          # in either location isn't a false-negative.
          FOUND=$(find squashfs-root -name 'libcudart.so*' | head -1)
          if [ -n "$FOUND" ]; then
            echo "::notice::libcudart bundled: $FOUND"
          else
            echo "::error::libcudart.so not bundled in the cuda AppImage — aborting cuda job."
            exit 1
          fi
          rm -rf squashfs-root

      - name: Upload cuda artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cuda-bundle
          path: release-artifacts/FlowShield_*_amd64-cuda.AppImage
          if-no-files-found: error
          retention-days: 7

  sign-and-release:
    name: Sign + publish to GitHub Releases
    needs: [build-linux, build-macos, build-linux-cuda]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: release-artifacts

      - name: Download macOS bundles
        uses: actions/download-artifact@v4
        with:
          name: macos-bundles
          path: release-artifacts

      - name: Download cuda bundle (best-effort)
        uses: actions/download-artifact@v4
        # The cuda job is non-blocking; if it failed/skipped, its artifact won't
        # exist. warn (not error) so the release still ships the CPU bundles.
        continue-on-error: true
        with:
          name: linux-cuda-bundle
          path: release-artifacts

      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Import GPG signing key
        id: gpg
        # Skip silently if the secret isn't provisioned yet — the release
        # still ships, just without GPG signatures. Provision the secret
        # (Settings → Secrets → Actions → GPG_PRIVATE_KEY, ASCII-armored)
        # when ready.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret not set — skipping signing. Bundles will publish unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "use-agent" > ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Imported GPG key $KEY_ID"

      - name: Sign artifacts
        if: steps.gpg.outputs.signed == 'true'
        working-directory: release-artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          KEY_ID: ${{ steps.gpg.outputs.key_id }}
        run: |
          # Detached signatures for each bundle artifact. Users verify with:
          #   gpg --verify flowshield_X.Y.Z_amd64.deb.asc flowshield_X.Y.Z_amd64.deb
          # .dmg gets a GPG sig too — not a substitute for Apple notarization
          # (which Gatekeeper actually checks), but lets users who care verify
          # the binary came from us until notarization is wired up.
          for f in *.deb *.rpm *.AppImage *.dmg; do
            [ -f "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$KEY_ID" \
              --detach-sign --armor --output "$f.asc" "$f"
          done
          # Clearsigned SHA256SUMS — single source of truth that ties all
          # artifacts together; what most distros expect for verification.
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$KEY_ID" \
            --clearsign --output SHA256SUMS.asc SHA256SUMS
          echo "--- signed artifacts ---"
          ls -la

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: FlowShield Desktop ${{ env.TAG }}
          generate_release_notes: true
          files: |
            release-artifacts/*

  publish-to-aur:
    # Pushes flowshield-bin to AUR after every v3.* tag. Bootstrap (account,
    # SSH key, initial PKGBUILD) is documented in scripts/release/aur/README.md.
    # The whole job no-ops cleanly if AUR_SSH_PRIVATE_KEY isn't provisioned —
    # so this can ship before AUR setup is finished without breaking releases.
    name: Publish to AUR
    needs: sign-and-release
    runs-on: ubuntu-22.04
    steps:
      - name: Check AUR secret presence
        id: gate
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY not set — skipping AUR publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Download bundles
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: release-artifacts

      - name: Render PKGBUILD from template
        if: steps.gate.outputs.publish == 'true'
        run: |
          # SHA against the locally built artifact, not the GitHub Release —
          # avoids a re-download and a race against asset-upload propagation.
          APPIMAGE=$(ls release-artifacts/FlowShield_*_amd64.AppImage)
          SHA=$(sha256sum "$APPIMAGE" | awk '{print $1}')
          # AUR rejects hyphens in pkgver. Keep _tagver with the original
          # form for the GitHub URL.
          TAGVER="${TAG#v}"
          PKGVER="${TAGVER//-/.}"
          mkdir -p aur-pkg
          sed \
            -e "s/__PKGVER__/${PKGVER}/g" \
            -e "s/__TAGVER__/${TAGVER}/g" \
            -e "s/__SHA256__/${SHA}/g" \
            scripts/release/aur/PKGBUILD.template > aur-pkg/PKGBUILD
          echo "--- rendered PKGBUILD ---"
          cat aur-pkg/PKGBUILD

      - name: Push to AUR
        if: steps.gate.outputs.publish == 'true'
        # The action regenerates .SRCINFO from the PKGBUILD inside an Arch
        # container, then commits + pushes via SSH. We only feed it the
        # rendered PKGBUILD; everything else (SRCINFO, git plumbing, ssh
        # known_hosts) is handled internally.
        # v2.7.2 had a bug — its entrypoint called `bash --command` (invalid
        # long option) and exited 2 before pushing. v4.1.3 has the same
        # input shape, just bumped to the latest stable.
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: flowshield-bin
          pkgbuild: ./aur-pkg/PKGBUILD
          commit_username: FlowShield Release Bot
          commit_email: noreply@flowshield.app
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'flowshield-bin ${{ env.TAG }}'
          ssh_keyscan_types: ed25519
