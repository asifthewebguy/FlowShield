<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlowShield Splash Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .splash {
    background: #0f172a;
    border-radius: 12px;
    width: 480px;
    height: 260px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.65);
    display: flex;
    flex-direction: column;
    padding: 32px 40px 28px;
    position: relative;
  }

  .main-row {
    display: flex;
    align-items: center;
    flex: 1;
  }

  /* Logo */
  .logo-wrap {
    width: 76px;
    height: 76px;
    margin-right: 24px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Text */
  .title {
    font-size: 38px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .subtitle {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    margin-top: 5px;
  }

  .subtitle.accent {
    color: #0ea5e9;
    margin-top: 2px;
  }

  /* Bottom bar */
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-label {
    font-size: 12px;
    color: #64748b;
    margin-right: 4px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0ea5e9;
  }

  .version {
    font-size: 11px;
    color: #334155;
  }

  /* Dot animation */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }

  .dot:nth-child(2) { animation: pulse 0.84s ease-in-out infinite 0s; }
  .dot:nth-child(3) { animation: pulse 0.84s ease-in-out infinite 0.28s; }
  .dot:nth-child(4) { animation: pulse 0.84s ease-in-out infinite 0.56s; }
</style>
</head>
<body>
<div class="splash">
  <div class="main-row">
    <!-- Logo -->
    <div class="logo-wrap">
      <img src="logo.png" alt="FlowShield logo">
    </div>

    <!-- Text -->
    <div>
      <div class="title">FlowShield</div>
      <div class="subtitle">Master Your Focus.</div>
      <div class="subtitle accent">Amplify Your Output.</div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom">
    <div class="status-row">
      <span class="status-label">Starting up</span>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <span class="version">v3.0.0</span>
  </div>
</div>
</body>
</html>
