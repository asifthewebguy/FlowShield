[package]
name = "flowshield-desktop"
version = "3.9.0-alpha.0"
description = "FlowShield desktop client"
authors = ["FlowShield"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowshield_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

# HTTP client. rustls so we don't pull in OpenSSL/native-tls quirks.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Async runtime — tauri::command async fns need one. `time` is for the
# tracker's tokio::time::interval (one-second poll loop).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }

# Cross-platform foreground-window query for the activity tracker.
# Wraps Win32 / Cocoa / X11 / Wayland under one Result-returning surface.
active-win-pos-rs = "0.8"

# OS-level idle-time query for AFK detection. Backed by IOKit (macOS),
# GetLastInputInfo (Windows), and XScreenSaver (Linux X11). Pure Wayland
# isn't supported — XWayland fallback works on most GNOME/KDE setups.
user-idle = "0.6"

# Local persistent store for the offline activity-sync queue. `bundled`
# pulls a vendored sqlite3 so the desktop installer doesn't depend on
# the user having libsqlite3 (matters on Windows + minimal macOS images).
rusqlite = { version = "0.32", features = ["bundled"] }

# Hostname / username lookup for device registration. Cross-platform —
# wraps gethostname / GetUserName / SCDynamicStoreCopyComputerName.
whoami = "1"
# AI model file integrity verification (Plan 1.2 model_download.rs).
# Pure-Rust SHA-256 — no openssl bindings, works in the same build matrix
# as ndarray/chrono.
sha2 = "0.10"
base64 = "0.22"

# Pixel manipulation for the dynamic tray icon (focus-session progress
# ring overlay). PNG-only feature set keeps compile fast — no jpeg/gif/etc.
image = { version = "0.25", default-features = false, features = ["png"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Version comparison for the in-app update check (update.rs). Handles our
# `3.x.y-alpha.N` prerelease format correctly, which a hand-rolled string
# compare wouldn't.
semver = "1"

# AI substrate cosine-similarity math (Plan 1.1). The concrete LLM + embedder
# crates (candle-core, hf-hub, tokenizers) land in Plan 1.2 once the trait
# surface is settled.
ndarray = "0.16"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"

# Plan 1.3 — concrete BGE-small embedder.
# candle is HuggingFace's pure-Rust ML framework; we use the CPU backend only
# in v1. candle-transformers ships a BertModel that parses the safetensors
# weights and runs the forward pass. Pinned to 0.8 so a candle 0.9 minor
# release can't break our forward-pass call shape mid-sprint.
candle-core         = { version = "0.8", default-features = false }
candle-nn           = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }

# HuggingFace tokenizer — loads tokenizer.json and produces input_ids /
# attention_mask / token_type_ids tensors. `onig` regex backend disabled to
# avoid the C++ dep on Windows; the default `unicode` regex backend is fine
# for BGE-small's WordPiece tokenizer.
tokenizers = { version = "0.20", default-features = false, features = ["onig" ] }

# Pinned safetensors so a transitive candle bump can't pull a breaking 0.5.
safetensors = "0.4"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
